[package]
name = "my-grpc-extensions"
version = "0.7.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
default = []
with-telemetry = ["dep:my-telemetry", "my-grpc-client-macros?/with-telemetry"]
grpc-client = ["my-grpc-client-macros"]
grpc-server = ["my-grpc-server-macros"]
# Links the TLS stack: my-tls / rustls, with **ring** as the rustls
# CryptoProvider — hence `ring` in the name. Without a TLS feature no rustls /
# webpki / ring crate enters the tree and `grpcs://` endpoints are rejected at
# connect time.
#
# `my-tls/with-ring-crypto-providers` is part of it on purpose: my-tls leaves the
# provider choice to the consumer, and with none installed its client-config and
# key-parsing calls fail at connect time. Turning this on has to give a working
# TLS, not a build that needs the caller to install a provider first.
#
# ring, not aws-lc-rs: no aws-lc-sys C build is inflicted on consumers. A caller
# who wants a different provider should depend on my-tls directly without either
# TLS feature and install their own.
with-ring-tls = ["dep:my-tls", "my-tls/with-ring-crypto-providers"]
# The pure-Rust alternative to `with-ring-tls`: same TLS functionality, no C
# toolchain anywhere — rustls-graviola as the CryptoProvider. Trade-off: graviola
# builds only on x86_64 and aarch64 and is far less widely deployed than ring, so
# prefer `with-ring-tls` unless getting rid of the C toolchain is the point.
#
# The two are not mutually exclusive — everything gated on TLS in this crate is
# `any(with-ring-tls, with-rust-tls)`; if both are on, my-tls picks ring.
with-rust-tls = ["dep:my-tls", "my-tls/with-rust-crypto-providers"]

with-ssh = ["my-ssh", "my-grpc-client-macros?/with-ssh"]


[dependencies]
my-telemetry = { tag = "1.3.0", git = "https://github.com/MyJetTools/my-telemetry.git", features = [
    "my-telemetry-writer",
], optional = true }

my-logger = { tag = "1.3.0", git = "https://github.com/MyJetTools/my-logger.git" }
rust-extensions = { tag = "0.1.5", git = "https://github.com/MyJetTools/rust-extensions.git", features = [
    "with-tokio",
] }

lazy_static = "*"
ahash = "*"


my-tls = { tag = "0.1.5", git = "https://github.com/MyJetTools/my-tls.git", optional = true }
tokio = { version = "*" }
tonic = { version = "*" }
hyper = { version = "*" }
hyper-util = { version = "*", features = ["tokio"] }
futures-util = "*"
tokio-stream = "*"
futures = "*"
async-trait = "*"
tower = { version = "*", features = ["util"] }
my-grpc-client-macros = { optional = true, path = "../my-grpc-client-macros" }
my-grpc-server-macros = { optional = true, path = "../my-grpc-server-macros" }
external-dependencies = { path = "../external-dependencies" }
futures-core = "*"

[target.'cfg(unix)'.dependencies]
my-ssh = { tag = "0.1.2", git = "https://github.com/MyJetTools/my-ssh.git", optional = true }
